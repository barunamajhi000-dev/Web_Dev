<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./dashboard.png" type="image/png">
    <title>Project Dashboard</title>
</head>
<body>
    <div id="main">
        <section class="allElems">
            <div class="todo elem" id="0">
                <img src="https://media.istockphoto.com/id/1170650529/photo/completed-tasks-are-ticked-off-on-a-to-do-list.webp?a=1&b=1&s=612x612&w=0&k=20&c=EgZz6J610nssp8Ch6i-Aicu-BVPs_Yky2BfpU5XPB_M=" alt="">
                <h2>To Do List</h2>
            </div>
            <div class="daily elem" id="1">
                <img src="https://images.unsplash.com/photo-1644946965891-a82ec145a357?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8OHx8ZGFpbHklMjBnb2Fsc3xlbnwwfHwwfHx8MA%3D%3D" alt="">
                <h2>Daily Planner</h2>    
            </div>
            <div class="Motivation elem" id="2">
                <img src="https://images.unsplash.com/photo-1522120691812-dcdfb625f397?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mjh8fG1vdGl2YXRpb258ZW58MHx8MHx8fDA%3D" alt="">
                <h2>Motivation</h2>
            </div>
            <div class="pomo elem" id="3">
                 <img src="https://plus.unsplash.com/premium_vector-1745223885034-1ba14019546f?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MjN8fGNsb2NrfGVufDB8fDB8fHww" alt="">
                <h2>Pomodoro Timer</h2>
             </div>
            <!-- <div class="goal elem" id="5">Daily Goals</div> -->
        </section>
        <section class="fullElem todo-list-fullpage">
            <button class="back" id="0">Close</button>
            <h2>Your Personalised To do List</h2>
            <div class="todo-container">
                <div class="addTask">
                    <form action="">
                        <input type="text" placeholder="Enter Task Name" id="">
                        <textarea  placeholder="Enter text....." id=""></textarea>
                        <button>Add Task</button>
                    </form>
                </div>
                <div class="allTask">
                    <!-- <button>Mark as Completed</button> -->
                </div>
            </div>
        </section>
        <section class="fullElem daily-plan-fullpage">
         <button class="back"id="1">Close</button>
            <h1>Daily Planner</h1>
        </section>
        <section class="fullElem motivational-fullpage">
            <button class="back"id="2">Close</button>
            <h1>Motivational Quotes</h1>
        </section>
        <section class="fullElem pomodoro-fullpage">
            <button class="back"id="3">Close</button>
            <h1>Pomodoro Timer</h1>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
